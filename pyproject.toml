[project]
name = "claim-evidence-verifier"
version = "1.0.0"
description = "Grounded claim verification with Cloudflare R2 and Gemini"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "boto3==1.43.89",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pypdf==6.14.2",
    "python-multipart==0.0.32",
    "uvicorn==0.49.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires user-owned external service credentials",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
