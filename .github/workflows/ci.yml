name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q app scripts tests
      - name: Run deterministic suite
        run: pytest -q
      - name: Scan tracked files and history
        run: python scripts/security_audit.py
      - name: Validate container configuration
        run: docker compose config --quiet
