name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q app scripts tests
      - name: Run deterministic suite
        run: python -m pytest -q
      - name: Scan tracked files and history
        run: python scripts/security_audit.py
      - name: Validate container configuration
        run: docker compose config --quiet
      - name: Build a fresh container image
        run: docker compose build --no-cache
      - name: Audit image metadata and layers
        run: python scripts/audit_image.py claim-evidence-verifier:local
      - name: Start the container
        run: docker compose up --detach --no-build
      - name: Wait for container health
        run: python scripts/wait_for_health.py http://127.0.0.1:8000/health
      - name: Stop the container
        if: always()
        run: docker compose down --remove-orphans
