name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q app scripts tests
      - name: Run deterministic suite
        run: pytest -q
      - name: Scan tracked files and history
        run: python scripts/security_audit.py
      - name: Validate container configuration
        run: docker compose config --quiet
      - name: Build a fresh container image
        run: docker build --no-cache --tag claim-evidence-verifier:ci .
      - name: Audit image metadata and layers
        run: python scripts/audit_image.py claim-evidence-verifier:ci
      - name: Start the container
        run: docker run --detach --name claim-verifier-ci --publish 8000:8000 claim-evidence-verifier:ci
      - name: Wait for container health
        run: python scripts/wait_for_health.py http://127.0.0.1:8000/health
      - name: Stop the container
        if: always()
        run: docker rm --force claim-verifier-ci || true
